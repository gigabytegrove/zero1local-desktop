<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="__LOCAL_TOKEN__">
<meta name="theme-color" content="#f2f5f8">
<title>Zero1Local Desktop</title>
<link rel="stylesheet" href="/app.css">
<script defer src="/startup.js"></script>
<script defer src="/app.js"></script>
</head><body>
<div class="app-frame">
<aside class="sidebar" aria-label="Primary navigation">
 <div class="side-brand"><img src="/brand-light.png" alt="Zero1Local" width="176" height="42"></div>
 <div class="side-product">Desktop <span class="product-tag">Companion</span></div>
 <div class="rail-label devices-label">Appliances</div>
 <div class="device-rail" id="device-rail"><span class="rail-empty">No appliances saved</span></div>
 <div class="rail-label">Workspace</div>
 <nav class="application-rail" aria-label="Desktop sections">
  <button class="app-nav-item active" type="button" data-nav="devices"><span class="nav-symbol" aria-hidden="true">▣</span> All NAS devices</button>
  <div id="device-navigation" class="device-navigation" hidden aria-label="Selected NAS navigation">
   <div class="device-nav-title" id="device-nav-title">Selected NAS</div>
   <button class="app-nav-item" type="button" data-nav="home"><span class="nav-symbol" aria-hidden="true">⌂</span> Overview</button>
  <button class="app-nav-item" type="button" data-nav="files"><span class="nav-symbol" aria-hidden="true">▦</span> File manager</button>
  <button class="app-nav-item" type="button" data-nav="shares"><span class="nav-symbol" aria-hidden="true">▤</span> Shared folders</button>
  <button class="app-nav-item" type="button" data-nav="mounts"><span class="nav-symbol" aria-hidden="true">⌘</span> Mapped drives</button>
  <details class="nav-management" id="nav-management">
   <summary>NAS management <span aria-hidden="true" class="chevron">⌄</span></summary>
   <div class="nav-management-links">
  <button class="app-nav-item" type="button" data-nav="system"><span class="nav-symbol" aria-hidden="true">⌁</span> System overview</button>
  <button class="app-nav-item" type="button" data-nav="storage"><span class="nav-symbol" aria-hidden="true">◫</span> Storage &amp; disks</button>
  <button class="app-nav-item" type="button" data-nav="network"><span class="nav-symbol" aria-hidden="true">◎</span> Network</button>
  <button class="app-nav-item" type="button" data-nav="docker"><span class="nav-symbol" aria-hidden="true">▥</span> Containers &amp; Docker</button>
  <button class="app-nav-item" type="button" data-nav="hardware"><span class="nav-symbol" aria-hidden="true">◇</span> Hardware</button>
  <button class="app-nav-item" type="button" data-nav="tasks"><span class="nav-symbol" aria-hidden="true">≡</span> Tasks &amp; jobs</button>
  <button class="app-nav-item" type="button" data-nav="users"><span class="nav-symbol" aria-hidden="true">♙</span> Users &amp; groups</button>
  <button class="app-nav-item" type="button" data-nav="services"><span class="nav-symbol" aria-hidden="true">⚙</span> Services</button>
  <button class="app-nav-item" type="button" data-nav="backups"><span class="nav-symbol" aria-hidden="true">⤴</span> Backups</button>
  <button class="app-nav-item" type="button" data-nav="protection"><span class="nav-symbol" aria-hidden="true">◇</span> Protection plans</button>
  <button class="app-nav-item" type="button" data-nav="activity"><span class="nav-symbol" aria-hidden="true">◉</span> Notifications</button>
   </div>
  </details>
  </div>
  <button class="app-nav-item nav-settings" type="button" data-nav="settings"><span class="nav-symbol" aria-hidden="true">⚙</span> Settings</button>
 </nav>
 <div class="side-footer"><span class="connection-dot"></span><span>Local desktop application<small>Windows · Linux · macOS</small></span></div>
</aside>
<div class="workspace">
 <header class="topbar">
  <div class="topbar-identity"><strong id="top-title">All NAS devices</strong><small id="top-subtitle">Zero1Local on this computer</small></div>
  <div class="topbar-appliance" id="workspace-switcher" hidden><button class="topbar-back" id="back-to-devices" type="button">All NAS devices</button><span class="topbar-path-separator" aria-hidden="true">/</span><label for="appliance-switcher">Current appliance</label><select id="appliance-switcher" aria-label="Switch Zero1Local appliance"></select><span class="topbar-presence" id="topbar-presence" role="status">No NAS selected</span></div>
  <div class="top-actions"><button class="btn btn-quiet" id="btn-discover" type="button">Scan network</button><button class="btn btn-primary" id="btn-add" type="button">+ Add NAS</button></div>
 </header>
 <main id="main" class="page" tabindex="-1"><div class="loading">Loading your desktop workspace…</div><noscript>JavaScript is required to use the Zero1Local Desktop workspace.</noscript></main>
</div></div>
<dialog id="modal" aria-labelledby="modal-title"><form method="dialog" id="modal-form"><div class="dialog-head"><h2 id="modal-title">Add appliance</h2><button class="icon-button" id="modal-close" aria-label="Close dialog" value="cancel">×</button></div><div id="modal-body"></div><div class="dialog-actions"><button class="btn btn-quiet" value="cancel">Cancel</button><button class="btn btn-primary" id="modal-submit" value="confirm">Continue</button></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
